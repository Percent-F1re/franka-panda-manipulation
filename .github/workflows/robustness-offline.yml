name: Static robustness checks
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependency
        run: python -m pip install numpy
      - name: Check robustness design (no MuJoCo needed)
        run: python -m unittest discover -s tests -p 'test_robustness_offline.py' -v
